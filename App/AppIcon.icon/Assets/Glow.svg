<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Figma 50:1639 "Glow": ellipse 230x362 centred at 512,512, accent #178A5F. Icon Composer has no layer blur,
       so the Figma "blur ~50" is baked in as a radial falloff; the 40 % opacity is set in icon.json. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#178A5F" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#178A5F" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#178A5F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="512" cy="512" rx="165" ry="231" fill="url(#glow)"/>
</svg>
