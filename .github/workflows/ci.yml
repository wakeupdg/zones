name: CI
on:
  push:
    branches: [integration, main]
  pull_request:
    branches: [main, integration]
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Package tests
        run: swift test 2>&1 | tail -80
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build app
        run: |
          if [ -f project.yml ]; then
            xcodegen generate
            xcodebuild -quiet -project Zones.xcodeproj -scheme Zones -configuration Debug CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -80
          else
            echo "no project.yml yet"
          fi
